<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>干饭罗盘 🧭 三大难题终结者</title>
<style>
/* ============ 干饭罗盘 · Apple 风格（依 emilkowalski/apple-design skill） ============
   原则：材质分层（毛玻璃边栏/底栏）、按下即时反馈、字号相关字距、层级靠字重与留白、
   单一强调色、进出同路径、尊重 reduced-motion / reduced-transparency */
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --sub:#86868B;
  --hair:rgba(0,0,0,.08); --fill:rgba(120,120,128,.12);
  --tint:#FF9500; --danger:#FF3B30;
  --r-card:18px; --r-btn:12px;
  --mat:rgba(255,255,255,.72);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- 壳：宽屏三栏（边栏 + 主区 + 右栏），窄屏单列 ---------- */
#app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.sidebar{display:none}
.rail{display:none}

/* ---------- 边栏（≥1024px，毛玻璃材质层） ---------- */
@media (min-width:1024px){
  #app{grid-template-columns:264px minmax(0,1fr);max-width:1280px;margin:0 auto}
  .sidebar{
    display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;
    padding:22px 14px 18px;background:var(--mat);
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    border-right:1px solid var(--hair);
  }
}
@media (min-width:1440px){
  #app{grid-template-columns:264px minmax(0,1fr) 328px;max-width:1440px}
  .rail{display:block}
}
.brand{font-size:17px;font-weight:650;letter-spacing:-0.01em;line-height:1.25}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--sub);letter-spacing:.01em}
.sidebar .brand{padding:0 10px 14px}

/* 边栏餐段列表 */
.mealList{display:flex;flex-direction:column;gap:2px;margin:0 4px 10px}
.mealItem{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;font-size:14px;font-weight:500;text-align:left;transition:background 120ms ease}
.mealItem:hover{background:rgba(0,0,0,.045)}
.mealItem:active{transform:scale(.98)}
.mealItem.on{background:rgba(0,0,0,.08);font-weight:600}
.mealItem .hint-s{margin-left:auto;font-size:11px;color:var(--sub);font-weight:400}

/* 边栏主导航 + 底部 */
.sideNav{display:flex;flex-direction:column;gap:2px;margin:0 4px;border-top:1px solid var(--hair);padding-top:10px}
.sideNav .navItem{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;font-size:14px;font-weight:500;text-align:left}
.sideNav .navItem:hover{background:rgba(0,0,0,.045)}
.sideNav .navItem.on{background:rgba(0,0,0,.08);font-weight:600}
.navIcon{width:19px;height:19px;flex:none;color:var(--sub)}
.sideNav .navItem.on .navIcon{color:var(--ink)}
.sideFoot{margin-top:auto;padding:12px 10px 0;font-size:11px;color:var(--sub);line-height:1.6}
#milkTeaSide{margin:10px 4px 0;padding:9px 10px;border-radius:9px;font-size:14px;font-weight:500;text-align:left;display:flex;gap:9px;align-items:center}
#milkTeaSide:hover{background:rgba(0,0,0,.045)}

/* ---------- 主区 ---------- */
main{min-width:0;padding:0 0 96px}
@media (min-width:1024px){
  main{padding:0 36px 48px}
  #mealTabs,#mealHint,#viewDecide{max-width:660px}
}
.mHead{display:flex;align-items:baseline;gap:10px;padding:16px 16px 2px}
@media (min-width:1024px){ .mHead{padding:28px 0 4px} }
.mHead .brand{display:none}
@media (max-width:1023.9px){ .mHead .brand{display:block} }
#dateLine{margin-left:auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
#milkTeaBtn{display:none;font-size:13px;font-weight:500;color:var(--ink);background:var(--fill);padding:6px 12px;border-radius:99px}
#milkTeaBtn:active{transform:scale(.96)}

/* 餐段分段控件（移动端，iOS segmented control） */
#mealTabs{display:flex;gap:2px;margin:10px 16px 0;background:var(--fill);padding:2px;border-radius:10px}
.mtab{flex:1;padding:7px 0;border-radius:8px;font-size:13px;font-weight:500;text-align:center;color:var(--ink);transition:transform 100ms ease-out}
.mtab small{display:none}
.mtab.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.10);font-weight:600}
.mtab:active{transform:scale(.97)}
#mealHint{padding:8px 20px 0;font-size:12px;color:var(--sub)}

/* ---------- 卡片与内容 ---------- */
.card{background:var(--card);border-radius:var(--r-card);padding:20px;margin:12px 16px 0;box-shadow:0 0 0 .5px rgba(0,0,0,.04),0 2px 10px rgba(0,0,0,.04)}
@media (min-width:1024px){ .card{margin-left:0;margin-right:0} }
.eyebrow{font-size:13px;font-weight:600;color:var(--sub);margin:18px 20px 0}
@media (min-width:1024px){ .eyebrow{margin:26px 0 0} }
.bigcard{text-align:left;padding:24px}
.bigcard .top{display:flex;align-items:flex-start;gap:14px}
.bigemoji{font-size:40px;line-height:1;margin-top:2px}
.bigname{font-size:26px;font-weight:700;letter-spacing:-0.022em;line-height:1.15}
.recs{font-size:13px;color:var(--sub);margin-top:3px}
.info{font-size:13px;color:var(--sub);margin-top:10px;line-height:1.7}
.info b{color:var(--ink);font-weight:600}
.tagline{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:11px;font-weight:500;color:var(--sub);background:var(--fill);padding:3px 9px;border-radius:99px}

.btnrow{display:flex;gap:9px;margin-top:18px}
.btn{flex:1;height:44px;border-radius:var(--r-btn);font-size:15px;font-weight:590;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--fill);color:var(--ink);transition:transform 100ms ease-out,background 120ms ease}
.btn:active{transform:scale(.97)}
@media (hover:hover){ .btn:hover{background:rgba(120,120,128,.18)} }
.btn.primary{background:var(--ink);color:#fff}
@media (hover:hover){ .btn.primary:hover{background:#2C2C2E} }
.btn.small{flex:0 0 auto;height:36px;padding:0 14px;font-size:13px;border-radius:10px}
.minirow{display:flex;gap:16px;justify-content:flex-end;margin-top:12px}
.mini{font-size:13px;color:var(--sub);padding:2px 0}
.mini.on{color:var(--tint);font-weight:600}
@media (hover:hover){ .mini:hover{color:var(--ink)} }
.mini:active{transform:scale(.97)}

/* 备选 */
.backsWrap{margin:16px 16px 0}
@media (min-width:1024px){ .backsWrap{margin:22px 0 0;max-width:560px} }
.backsWrap h4{font-size:13px;font-weight:600;color:var(--sub);margin:0 0 8px 2px}
.backs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.back{background:var(--card);border-radius:14px;padding:14px;font-size:13px;text-align:left;box-shadow:0 0 0 .5px rgba(0,0,0,.04),0 1px 6px rgba(0,0,0,.04);transition:transform 100ms ease-out}
.back:active{transform:scale(.97)}
@media (hover:hover){ .back:hover{box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 3px 10px rgba(0,0,0,.07)} }
.back .e{font-size:20px}
.back .n{font-weight:600;margin-top:4px;letter-spacing:-0.01em}
.back .p{font-size:11px;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums}
.back:active{transform:scale(.98)}

.notice{background:#FFF3E0;border-radius:12px;padding:9px 13px;font-size:12.5px;color:#8A5A00;margin:12px 16px 0}
@media (min-width:1024px){ .notice{margin:16px 0 0;max-width:560px} }
.dim{color:var(--sub);font-size:12px}

/* ---------- 筛选（移动端 details / 桌面右栏共用组） ---------- */
details.filters{margin:12px 16px 0;background:var(--card);border-radius:var(--r-card);padding:14px 16px;font-size:13px;box-shadow:0 0 0 .5px rgba(0,0,0,.04),0 1px 6px rgba(0,0,0,.04)}
details.filters summary{font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}
details.filters summary::after{content:"";width:8px;height:8px;border-right:1.8px solid var(--sub);border-bottom:1.8px solid var(--sub);transform:rotate(45deg);transition:transform 150ms ease}
details.filters[open] summary::after{transform:rotate(225deg)}
@media (min-width:1024px){ details.filters{display:none} }
.fgroup{margin-top:12px}
.fgroup .lb{font-size:11px;font-weight:600;color:var(--sub);margin-bottom:4px;letter-spacing:.02em}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:99px;background:var(--fill);font-size:13px;font-weight:500;user-select:none;transition:transform 100ms ease-out,background 120ms}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:#fff;font-weight:600}

/* iOS 开关 */
.togglerow{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:500;user-select:none}
.sw{width:42px;height:26px;border-radius:99px;background:rgba(120,120,128,.22);position:relative;flex:none;transition:background 180ms ease}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform 180ms cubic-bezier(.3,.7,.4,1)}
.switch.on .sw{background:#34C759}
.switch.on .sw::after{transform:translateX(16px)}

/* ---------- 右栏（≥1440px） ---------- */
.rail{padding:28px 8px 48px 0}
.rail .card{padding:16px}
.rail h4{font-size:13px;font-weight:600;color:var(--sub);margin:0 0 8px}
.rail .card + .card{margin-top:12px}

/* ---------- 记录 / 设置 ---------- */
.statrow{display:flex;gap:10px}
.stat{flex:1;background:var(--card);border-radius:14px;padding:13px;text-align:center;box-shadow:0 0 0 .5px rgba(0,0,0,.04)}
.stat b{font-size:21px;font-weight:700;display:block;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--sub)}
.toplist{margin-top:8px;font-size:13.5px;line-height:2}
.loglist{margin-top:2px;font-size:13.5px}
.logitem{display:flex;gap:9px;padding:9px 2px;border-bottom:1px solid var(--hair);align-items:baseline}
.logitem:last-child{border-bottom:none}
.logitem .d{color:var(--sub);font-size:11px;min-width:48px;font-variant-numeric:tabular-nums}
.logitem .m{color:var(--sub);font-size:11px;min-width:22px}
.logitem .n{flex:1;font-weight:500}
select,input[type=text],input[type=number]{padding:9px 11px;border-radius:10px;border:none;background:var(--fill);font:inherit;color:var(--ink);width:100%;-webkit-appearance:none;appearance:none}
select:focus,input:focus{outline:2px solid rgba(255,149,0,.5);outline-offset:1px}
.formrow{display:flex;gap:8px;margin-top:9px;align-items:center}
.formrow>*{min-width:0}
h3.sec{font-size:13px;font-weight:600;color:var(--sub);margin:18px 4px 8px;letter-spacing:.02em}
.plist{font-size:13.5px}
.plist .pi{display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--hair);padding:8px 0}
.plist .pi:last-of-type{border-bottom:none}
.plist .pn{flex:1;font-weight:500}
.pbtn{color:var(--sub);font-size:14px;padding:4px 8px}
.pbtn:active{transform:scale(.92)}

/* ---------- 底部导航（<1024px，毛玻璃材质） ---------- */
#bottomNav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8vw;z-index:50;
  background:var(--mat);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-top:.5px solid var(--hair);padding-bottom:env(safe-area-inset-bottom)}
#bottomNav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;font-size:10.5px;font-weight:500;color:var(--sub);min-width:64px}
#bottomNav button.on{color:var(--ink);font-weight:600}
.navIcon{display:block;margin:0 auto}
@media (min-width:1024px){ #bottomNav{display:none} }

/* ---------- 浮层：转盘 / 结果（进出同路径：缩放+淡入淡出） ---------- */
#overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(0,0,0,.34);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#overlay[hidden]{display:none}
.sheet{background:var(--bg);border-radius:22px;padding:22px;max-width:460px;width:100%;text-align:center;
  box-shadow:0 18px 60px rgba(0,0,0,.25);animation:sheetIn 300ms cubic-bezier(.32,.72,0,1)}
@keyframes sheetIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.sheet h5{font-size:13px;font-weight:600;color:var(--sub)}
#wheelCanvas{width:min(380px,76vw);height:min(380px,76vw);margin:14px auto 4px;display:block}
.winName{font-size:23px;font-weight:700;letter-spacing:-0.02em;margin-top:4px}
.winEmoji{font-size:38px;margin-top:8px}

#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
  background:rgba(28,28,30,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:500;opacity:0;transition:opacity .22s;pointer-events:none;z-index:200;max-width:86vw;text-align:center}
@media (min-width:1024px){ #toast{bottom:36px} }
.spacer{height:10px}
.center{text-align:center}

/* ---------- 动效与可访问性（skill §14） ---------- */
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
  .sheet{animation:none}
}
@media (prefers-reduced-transparency: reduce){
  .sidebar,#bottomNav,#toast{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none}
  #overlay{background:rgba(0,0,0,.55);backdrop-filter:none}
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">干饭罗盘 🧭<small>三大难题终结者</small></div>
    <nav class="mealList" id="mealTabsDesk"></nav>
    <button id="milkTeaSide" data-act="milk">🧋 奶茶转盘<span class="hint-s">下午茶专用</span></button>
    <nav class="sideNav" id="sideNav"></nav>
    <div class="sideFoot" id="sideFoot"></div>
  </aside>

  <main>
    <div class="mHead">
      <div class="brand">干饭罗盘 🧭<small>三大难题终结者</small></div>
      <button id="milkTeaBtn" data-act="milk">🧋 奶茶转盘</button>
      <span id="dateLine"></span>
    </div>
    <nav id="mealTabs"></nav>
    <div id="mealHint"></div>

    <section id="viewDecide"></section>
    <section id="viewLog" hidden></section>
    <section id="viewSet" hidden></section>
  </main>

  <aside class="rail">
    <div class="card" id="railFilters"></div>
    <div class="card" id="railStats"></div>
  </aside>

  <nav id="bottomNav"></nav>
</div>

<div id="overlay" hidden>
  <div class="sheet" id="sheetBody"></div>
</div>
<div id="toast"></div>

<script src="data.js"></script>
<script>
"use strict";
/* ================= 干饭罗盘 v0.2 =================
 * 架构：内容后端 = data.js（git push 更新）｜个人后端 = localStorage（gf.* 键）
 * UI 依 emilkowalski/apple-design skill 重制
 */
const DATA = window.GANFAN_DATA;
if (!DATA || !DATA.takeout) {
  document.getElementById("viewDecide").innerHTML =
    '<div class="card">⚠️ 没找到 data.js 或数据为空。请确认 data.js 和本文件在同一目录。</div>';
  throw new Error("data.js missing");
}

/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
const CAT_EMOJI = { "包子粥品":"🥟","西式快餐":"🍔","中式快餐":"🍚","面馆水饺":"🍜","特色小吃":"🍢","茶饮咖啡":"🧋","食堂":"🏫" };
const TIER_TEXT = { gold:"🥇 6:00起送·稳", ontime:"🥈 6:30起送·可以", risky:"⚠️ 7:00起·压线", always:"⚡ 全天可送", none:"" };
const TAGS_ALL = ["辣","清淡","实惠","贵","快","管饱","健康","甜","咖啡"];
const REROLL_MAX = 5;
const ICONS = {
  decide:'<svg class="navIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="8.7" cy="8.7" r="1.35" fill="currentColor" stroke="none"/><circle cx="15.3" cy="15.3" r="1.35" fill="currentColor" stroke="none"/><circle cx="15.3" cy="8.7" r="1.35" fill="currentColor" stroke="none"/><circle cx="8.7" cy="15.3" r="1.35" fill="currentColor" stroke="none"/></svg>',
  log:'<svg class="navIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H19v17.5H7.5A2.5 2.5 0 0 0 5 22z"/><path d="M5 19.5V4.5"/><path d="M9 7h6M9 10.5h6"/></svg>',
  set:'<svg class="navIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.5-2.3 1a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-1-2 3.5 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.5 2.3-1a7 7 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7 7 0 0 0 2-1.2l2.3 1 2-3.5-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>'
};

function hashStr(s){ let h=1779033703^s.length; for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=(h<<13)|(h>>>19);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function shortName(n){ return n.replace(/（.*?）|\(.*?\)/g,"") || n; }
function catEmoji(p){ return CAT_EMOJI[p.cat] || "🍽️"; }
function todayKey(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d; }
function parseHM(s){ const [h,m]=s.split(":").map(Number); return h*60+(m||0); }
function openAt(p, d){
  const mins=d.getHours()*60+d.getMinutes();
  return (p.hours||[]).some(r=>{ let s=parseHM(r[0]), e=parseHM(r[1]); if(e<=s) e+=1440; return mins>=s && mins<e; });
}
function toast(msg, ms){
  const t=$("toast"); t.textContent=msg; t.style.opacity=1;
  clearTimeout(toast._h); toast._h=setTimeout(()=>t.style.opacity=0, ms||2200);
}

/* ---------- 个人数据（localStorage）---------- */
function lsGet(k, def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function lsSet(k, v){ localStorage.setItem(k, JSON.stringify(v)); }
const S = {
  meal:null, tab:"decide", swapIdx:null, lastPickKey:null, filtersOpen:false,
  hist: lsGet("gf.history",[]),
  wish: lsGet("gf.wishlist",[]),
  black: lsGet("gf.blacklist",[]),
  ratings: lsGet("gf.ratings",{}),
  filters: Object.assign({price:0,dist:0,cats:[],tags:[],wishOnly:false,noToday:true,risky:false}, lsGet("gf.filters",{})),
  daily: lsGet("gf.daily",{}),
  custom: lsGet("gf.custom",[]),
};
function saveAll(){
  lsSet("gf.history",S.hist); lsSet("gf.wishlist",S.wish); lsSet("gf.blacklist",S.black);
  lsSet("gf.ratings",S.ratings); lsSet("gf.filters",S.filters); lsSet("gf.daily",S.daily); lsSet("gf.custom",S.custom);
}
function allPlaces(){ return DATA.takeout.concat(S.custom); }
function placeById(id){ return allPlaces().find(p=>p.id===id); }
function isWish(p){ return S.wish.includes(p.id); }
function isBan(p){ return S.black.includes(p.id); }

/* ---------- 餐段 ---------- */
function autoMeal(){
  const h=new Date().getHours();
  if(h>=5 && h<10) return "breakfast";
  if(h>=10 && h<14) return "lunch";
  if(h>=14 && h<21) return "dinner";
  return "latenight";
}
function mealIsTomorrow(){ return S.meal==="breakfast" && new Date().getHours()>=21; }
function dailyKey(){ return todayKey(mealIsTomorrow()?addDays(1):new Date())+"|"+S.meal; }

/* ---------- 池子构建 ---------- */
function weightOf(p){
  let w=1;
  if(isWish(p)) w*=2;
  const r=S.ratings[p.id];
  if(r>0) w*=1.3; else if(r<0) w*=0.5;
  const n=weekCount(p.id);
  if(n>0) w/= (1+0.5*n);
  return w;
}
function eatenToday(id){ return S.hist.some(h=>h.d===todayKey() && h.id===id); }
function weekCount(id){
  const cutoff=Date.now()-7*864e5;
  return S.hist.filter(h=>h.id===id && new Date(h.d+"T12:00:00").getTime()>=cutoff).length;
}
function applyHardFilters(pool){
  const f=S.filters;
  if(f.price) pool=pool.filter(p=>(p.price||0)<=f.price);
  if(f.dist) pool=pool.filter(p=>(p.distKm||0)<=f.dist);
  if(f.cats.length) pool=pool.filter(p=>f.cats.includes(p.cat));
  if(f.tags.length) pool=pool.filter(p=>f.tags.some(t=>(p.tags||[]).includes(t)));
  if(f.wishOnly) pool=pool.filter(p=>isWish(p));
  return pool;
}
function buildPool(meal){
  const f=S.filters;
  let pool=allPlaces().filter(p=>!isBan(p));
  if(meal==="breakfast"){
    const tiers=DATA.meals.breakfast.tiers;
    pool=pool.filter(p=>tiers.includes(p.tier||"none") || (f.risky && p.tier==="risky"));
  }else{
    pool=pool.filter(p=>p.cat!=="茶饮咖啡");
    pool=pool.filter(p=>!p.meals || p.meals.includes(meal));
  }
  pool=applyHardFilters(pool);
  let notice="";
  if(f.noToday){
    const rest=pool.filter(p=>!eatenToday(p.id));
    if(rest.length>0) pool=rest;
    else notice="今天吃过的把池子吃空了，本轮先把它们放回来了 🤷";
  }
  if(meal==="lunch"||meal==="dinner"){
    const open=pool.filter(p=>openAt(p,new Date()));
    if(open.length>=3) pool=open;
  }
  if(meal==="latenight"){
    let open=pool.filter(p=>openAt(p,new Date()));
    if(open.length===0){
      open=pool.filter(p=>p.tier==="always");
      if(open.length) notice="这个点基本全打烊了，只剩 24 小时店撑场面 🌃";
    }
    if(open.length) pool=open;
  }
  return { pool, notice };
}
function drinkPool(){ return allPlaces().filter(p=>p.cat==="茶饮咖啡" && !isBan(p)); }

/* ---------- 每日一推（日期做种，当天固定）---------- */
function weightedIndex(arr, rng){
  const ws=arr.map(weightOf); let total=0; ws.forEach(w=>total+=w);
  let r=rng()*total;
  for(let i=0;i<arr.length;i++){ r-=ws[i]; if(r<=0) return i; }
  return arr.length-1;
}
function getPicks(){
  const key=dailyKey();
  const rec=S.daily[key]||(S.daily[key]={n:0,seen:[]});
  const {pool,notice}=buildPool(S.meal);
  const unseen=pool.filter(p=>!rec.seen.includes(p.id));
  const use=unseen.length>=3?unseen:pool;
  const rng=mulberry32(hashStr(key+"|"+rec.n+"|ganfan"));
  const arr=use.slice(); const picks=[];
  for(let k=0;k<3 && arr.length;k++){ const i=weightedIndex(arr,rng); picks.push(arr[i]); arr.splice(i,1); }
  return { main:picks[0]||null, backs:picks.slice(1), notice };
}
function currentPicks(){
  const key=dailyKey();
  if(S.lastPickKey!==key){ S.lastPickKey=key; S.swapIdx=null; S.cache=null; }
  if(!S.cache) S.cache=getPicks();
  return S.cache;
}
function doReroll(){
  const key=dailyKey(); const rec=S.daily[key]||(S.daily[key]={n:0,seen:[]});
  const cur=currentPicks().main;
  if(rec.n>=REROLL_MAX){ toast("天意已定！去吃「"+shortName(cur?cur.name:"它")+"」吧 🙏"); return; }
  if(cur) rec.seen.push(cur.id);
  rec.n++;
  saveAll(); S.cache=null; S.swapIdx=null; renderDecide();
}

/* ---------- 转盘 ---------- */
const wheel={pool:[],rot:0,spinning:false,winner:null,sameId:null,sameN:0};
const PALETTE=["#FFE3B0","#FFD1A1","#FFB8A8","#F3C6E9","#C9CFF5","#B8DDFF","#B5EAD3","#FDE9A8","#E4D2F5","#FFD6E0","#C8ECD9","#F5DEC9"];
function openWheel(pool){
  pool=pool.filter(p=>!isBan(p));
  if(pool.length<2){ toast("候选太少，转不动，放宽筛选吧"); return; }
  wheel.pool=[...pool].sort((a,b)=>weightOf(b)-weightOf(a)).slice(0,12);
  $("overlay").hidden=false;
  $("sheetBody").innerHTML='<h5>天意转盘 · '+wheel.pool.length+' 进 1</h5>'
    +'<canvas id="wheelCanvas"></canvas>'
    +'<div class="btnrow"><button class="btn" data-act="closeWheel">关掉</button><button class="btn primary" data-act="spin">转起来</button></div>';
  drawWheel(0);
}
function drawWheel(rot){
  const cv=$("wheelCanvas"); if(!cv) return;
  const size=cv.clientWidth||300, dpr=window.devicePixelRatio||1;
  cv.width=size*dpr; cv.height=size*dpr;
  const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  const cx=size/2, cy=size/2, R=size/2-8, n=wheel.pool.length, seg=2*Math.PI/n;
  ctx.clearRect(0,0,size,size);
  for(let i=0;i<n;i++){
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,R,i*seg+rot,(i+1)*seg+rot);
    ctx.closePath(); ctx.fillStyle=PALETTE[i%PALETTE.length]; ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.95)"; ctx.lineWidth=2; ctx.stroke();
  }
  ctx.fillStyle="#1D1D1F"; ctx.textAlign="right"; ctx.textBaseline="middle";
  ctx.font="600 "+Math.round(size*0.041)+"px -apple-system,'PingFang SC',sans-serif";
  for(let i=0;i<n;i++){
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(i*seg+seg/2+rot);
    ctx.fillText(shortName(wheel.pool[i].name).slice(0,7), R-12, 0);
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(cx,cy,size*0.095,0,2*Math.PI); ctx.fillStyle="#fff"; ctx.fill();
  ctx.strokeStyle="rgba(0,0,0,.08)"; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle="#1D1D1F"; ctx.font="700 "+Math.round(size*0.05)+"px sans-serif"; ctx.textAlign="center";
  ctx.fillText("GO", cx, cy+1);
  ctx.beginPath(); ctx.moveTo(cx-size*0.045,4); ctx.lineTo(cx+size*0.045,4); ctx.lineTo(cx,size*0.085); ctx.closePath();
  ctx.fillStyle="#1D1D1F"; ctx.fill();
}
function spinWheel(){
  if(wheel.spinning||!wheel.pool.length) return;
  wheel.spinning=true;
  const n=wheel.pool.length, seg=2*Math.PI/n;
  const idx=Math.floor(Math.random()*n);
  const base=3*Math.PI/2-(idx*seg+seg/2);
  const target=base+Math.PI*2*5+(Math.random()-0.5)*seg*0.5;
  const t0=performance.now(), dur=4000, start=wheel.rot;
  const total=start+target;
  function frame(t){
    const p=Math.min(1,(t-t0)/dur), ease=1-Math.pow(1-p,3);
    wheel.rot=start+(total-start)*ease;
    drawWheel(wheel.rot);
    if(p<1) requestAnimationFrame(frame);
    else{
      wheel.spinning=false; wheel.winner=wheel.pool[idx];
      if(wheel.sameId===wheel.winner.id) wheel.sameN++; else {wheel.sameId=wheel.winner.id; wheel.sameN=1;}
      let extra=wheel.sameN>=3?'<div class="notice" style="margin-top:12px">🎲 连着三次都是它，这就是天意吧！</div>':"";
      $("sheetBody").innerHTML='<h5>天意选中了</h5>'
        +'<div class="winEmoji">'+catEmoji(wheel.winner)+"</div>"
        +'<div class="winName">'+wheel.winner.name+"</div>"
        +'<div class="info" style="margin-top:6px">'+placeLine(wheel.winner)+(wheel.winner.recs?" · "+wheel.winner.recs:"")+"</div>"+extra
        +'<div class="btnrow"><button class="btn" data-act="closeWheel">算了</button><button class="btn" data-act="spin">再转一次</button></div>'
        +'<div class="btnrow"><button class="btn primary" data-act="wlog">就吃它 · 记一笔</button></div>'
        +'<div class="minirow"><button class="mini" data-act="wwish">🤍 收心愿单</button><button class="mini" data-act="wban">🚫 拉黑它</button></div>';
    }
  }
  requestAnimationFrame(frame);
}

/* ---------- 事件 ---------- */
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act, arg=el.dataset.arg;
  switch(act){
    case "meal": S.meal=arg; S.cache=null; S.swapIdx=null; S.lastPickKey=null; renderTabs(); if(S.tab!=="decide") switchTab("decide"); else renderDecide(); break;
    case "tab": switchTab(arg); break;
    case "reroll": doReroll(); break;
    case "swap": S.swapIdx=+arg; renderDecide(); break;
    case "log": { const p=currentPicks().main; logPlace(p); toast("记好啦，干饭愉快 🍚"); renderDecide(); break; }
    case "wish": { const p=currentPicks().main; if(p){ toggleArr("gf.wishlist",S.wish,p.id); renderDecide(); renderRail(); } break; }
    case "ban": { const p=currentPicks().main; if(p){ toggleArr("gf.blacklist",S.black,p.id); S.cache=null; renderDecide(); toast("已拉黑，眼不见为净"); } break; }
    case "wheel": { const {pool}=buildPool(S.meal); openWheel(pool); break; }
    case "milk": openWheel(drinkPool()); break;
    case "spin": spinWheel(); break;
    case "closeWheel": $("overlay").hidden=true; break;
    case "wlog": logPlace(wheel.winner); $("overlay").hidden=true; toast("记好啦，干饭愉快 🍚"); break;
    case "wwish": if(wheel.winner) toggleArr("gf.wishlist",S.wish,wheel.winner.id); break;
    case "wban": if(wheel.winner){ toggleArr("gf.blacklist",S.black,wheel.winner.id); toast("已拉黑"); } break;
    case "backfill": { const p=placeById($("backfillSel").value); logPlace(p); toast("补上啦"); break; }
    case "unwish": S.wish=S.wish.filter(x=>x!==arg); saveAll(); renderSet(); renderRail(); break;
    case "unban": S.black=S.black.filter(x=>x!==arg); saveAll(); S.cache=null; renderSet(); break;
    case "doban": { const id=$("banSel").value; if(id&&!S.black.includes(id)){ S.black.push(id); saveAll(); S.cache=null; renderSet(); } break; }
    case "addcustom": {
      const name=$("cusName").value.trim(); if(!name){ toast("先起个名字"); break; }
      S.custom.push({ id:"u"+Date.now(), name, cat:$("cusCat").value, price:+$("cusPrice").value||0, distKm:0, tags:["实惠"], meals:["lunch","dinner"], hours:[["00:00","24:00"]], tier:"none" });
      saveAll(); renderSet(); toast("加上了，午饭晚饭都能抽到");
      break;
    }
    case "delcustom": S.custom=S.custom.filter(p=>p.id!==arg); saveAll(); renderSet(); break;
    case "fprice": S.filters.price=+arg; saveAll(); S.cache=null; renderDecide(); break;
    case "fdist": S.filters.dist=+arg; saveAll(); S.cache=null; renderDecide(); break;
    case "fcat": { const i=S.filters.cats.indexOf(arg); i>=0?S.filters.cats.splice(i,1):S.filters.cats.push(arg); saveAll(); S.cache=null; renderDecide(); break; }
    case "ftag": { const i=S.filters.tags.indexOf(arg); i>=0?S.filters.tags.splice(i,1):S.filters.tags.push(arg); saveAll(); S.cache=null; renderDecide(); break; }
    case "ftog": S.filters[arg]=!S.filters[arg]; saveAll(); S.cache=null; renderDecide(); break;
    case "export": {
      const blob=new Blob([JSON.stringify({history:S.hist,wishlist:S.wish,blacklist:S.black,ratings:S.ratings,filters:S.filters,daily:S.daily,custom:S.custom},null,2)],{type:"application/json"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="ganfan-backup-"+todayKey()+".json"; a.click();
      break;
    }
    case "import": $("importFile").click(); break;
    case "wipe": if(confirm("真的要清空全部记录/心愿单/黑名单？")) if(confirm("最后一次确认：清空后无法恢复！")){ ["gf.history","gf.wishlist","gf.blacklist","gf.ratings","gf.filters","gf.daily","gf.custom"].forEach(k=>localStorage.removeItem(k)); location.reload(); } break;
  }
});
function toggleArr(key, arr, id){
  const i=arr.indexOf(id);
  if(i>=0) arr.splice(i,1); else arr.push(id);
  saveAll();
}
document.addEventListener("change", e=>{
  if(e.target.id==="importFile"){
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ try{
      const j=JSON.parse(rd.result);
      if(j.history) lsSet("gf.history",j.history); if(j.wishlist) lsSet("gf.wishlist",j.wishlist);
      if(j.blacklist) lsSet("gf.blacklist",j.blacklist); if(j.ratings) lsSet("gf.ratings",j.ratings);
      if(j.filters) lsSet("gf.filters",j.filters); if(j.daily) lsSet("gf.daily",j.daily); if(j.custom) lsSet("gf.custom",j.custom);
      location.reload();
    }catch(err){ toast("文件不对，导入失败"); } };
    rd.readAsText(f);
  }
});

/* ---------- 启动 ---------- */
(function init(){
  const wd=["周日","周一","周二","周三","周四","周五","周六"];
  const d=new Date();
  $("dateLine").textContent=(d.getMonth()+1)+"月"+d.getDate()+"日 · "+wd[d.getDay()];
  const stalls=(DATA.canteen&&DATA.canteen.stalls)||[];
  $("sideFoot").innerHTML="data.js v"+DATA.version+" · "+DATA.updatedAt+"<br>外卖 "+DATA.takeout.length+" 家 · 食堂 "+stalls.length+" 窗口";
  S.meal=autoMeal();
  renderTabs(); renderNav(); switchTab("decide");
  if(new Date().getHours()>=21 && S.meal==="latenight"){
    setTimeout(()=>toast("🌙 宵夜模式。或者看看「早餐」，明早吃什么已经备好了"), 600);
  }
})();
</script>
</body>
</html>
